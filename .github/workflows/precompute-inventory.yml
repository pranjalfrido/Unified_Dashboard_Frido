name: Precompute Inventory Cache

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > sa_key.json

      - name: Sync raw tables to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node export_to_supabase.mjs

      - name: Trigger inventory precompute
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.VITE_API_URL }}/api/inventory" \
            -H "Content-Type: application/json" \
            -d '{"start":"'"$(date -d '7 days ago' '+%Y-%m-%d')"'","end":"'"$(date '+%Y-%m-%d')"'","avgSaleWindowDays":7}'
