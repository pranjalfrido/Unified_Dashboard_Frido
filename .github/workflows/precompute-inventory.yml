name: Precompute Inventory Cache

on:
  schedule:
    - cron: '0 * * * *'  # hourly — matches Shelfwise's own sync cadence in GCP
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > sa_key.json

      - name: Refresh corrected Shelfwise-based inventory snapshot (BigQuery)
        run: node scripts/refresh_inventory_snapshot_hourly.mjs

      - name: Sync raw tables to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node export_to_supabase.mjs

      - name: Generate static inventory JSON (7d / 15d / 30d)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/generate-inv-cache.mjs

      - name: Refresh facility/state/channel reference data from BQ
        run: npm run refresh-ref-data

      - name: Generate static sales & allocation JSON
        run: node scripts/generate-sales-alloc-cache.mjs

      - name: Generate static inward JSON
        run: node scripts/generate-inward-cache.mjs

      - name: Generate static logistics JSON
        run: node scripts/generate-logistics-cache.mjs

      # Pulls new AWB category / sub-category / dimensions from BigQuery into Supabase.
      # Runs BEFORE the aggregates so the cube is rebuilt from fresh categories in the same
      # pass — otherwise a re-categorised product would wait an extra hour to appear.
      #
      # Incremental: it skips AWBs already synced (14.44 lakh of 14.73 lakh on the last run)
      # and fetches only the new ones, so this adds ~1 minute, not a full 5.6M-row scan.
      #
      # continue-on-error: this workflow also refreshes inventory, P&L, ads and sales. A
      # BigQuery outage should not cost all of that to avoid category data being one hour
      # stale — and because the sync is incremental, the next run picks up whatever it
      # missed, so nothing is lost. The step is marked failed in the Actions UI, and the
      # guard below prints a loud line in the log, so a sync quietly broken for weeks is
      # still visible rather than silent.
      - name: Sync AWB dimensions from BigQuery
        id: awb_sync
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/sync-awb-dims.mjs

      - name: Flag AWB sync failure
        if: steps.awb_sync.outcome == 'failure'
        run: |
          echo "::warning title=AWB dimension sync failed::awb_shipment_dims was NOT updated this run. Cost-by-product categories may be stale. The sync is incremental, so the next hourly run will catch up — but if this warning repeats, investigate."

      - name: Rebuild logistics cost aggregates if ledger changed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/refresh-cost-aggregates-if-stale.mjs

      - name: Generate static logistics cost JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/generate-logistics-cost-cache.mjs

      - name: Generate static ads JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/generate-ads-cache.mjs

      - name: Generate static P&L JSON (MTD, no filters)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEON_URL: ${{ secrets.NEON_URL }}
        run: node scripts/generate-pnl-cache.mjs

      - name: Commit and push static data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r public /tmp/public_generated
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/public_generated/*.json public/
          git add public/inv-data-7d.json public/inv-data-15d.json public/inv-data-30d.json \
                  public/sales-alloc-data.json public/inward-data.json public/logistics-data.json \
                  public/logistics-data-cod.json public/logistics-data-prepaid.json \
                  public/logistics-data-forward.json public/logistics-data-reverse.json \
                  public/logistics-cost-data.json public/ads-data.json public/pnl-data.json \
                  public/logistics-data-forward-cod.json public/logistics-data-forward-prepaid.json \
                  public/logistics-data-reverse-cod.json public/logistics-data-reverse-prepaid.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update static data cache"
          git push origin main
