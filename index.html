<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 48 48' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='24' cy='24' r='20.5' fill='%231a1c23' stroke='%23175A4A' stroke-width='2.6'/%3E%3Cpath d='M15.5 33 L15.5 15 L32.5 30 L32.5 16.5' fill='none' stroke='%23e8eaf0' stroke-width='5.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M32.5 10 L28.3 17.8 L32.5 15.6 L36.7 17.8 Z' fill='%230D9E68'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <title>Frido Navigator</title>
    <script>
      // Applied before first paint so the saved theme is already on <html> when the
      // stylesheet resolves - otherwise the page paints the default palette first and
      // visibly flips once React mounts. Inline and synchronous on purpose.
      (function () {
        try {
          var t = localStorage.getItem("frido.theme");
          document.documentElement.setAttribute("data-theme", ["forest"].indexOf(t) >= 0 ? t : "forest");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "forest");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      }, { passive: false });
    </script>
  </body>
</html>
