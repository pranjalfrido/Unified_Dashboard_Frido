<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/frido-navigator-icon-light-theme (2).png" sizes="64x64" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <title>Frido Navigator</title>
    <script>
      // Applied before first paint so the saved theme is already on <html> when the
      // stylesheet resolves - otherwise the page paints the default palette first and
      // visibly flips once React mounts. Inline and synchronous on purpose.
      (function () {
        try {
          var t = localStorage.getItem("frido.theme");
          document.documentElement.setAttribute("data-theme", ["gold", "indigo", "forest"].indexOf(t) >= 0 ? t : "forest");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "forest");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      }, { passive: false });
    </script>
  </body>
</html>
