<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Pinch/double-tap zoom stays enabled (accessibility, reading dense tables on a phone).
         viewport-fit=cover lets env(safe-area-inset-*) work on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <!-- Internal dashboard: keep it out of search engines (see also public/robots.txt). -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Phones: the status bar matches the Ivory page header (HEADER_MOBILE_PROMPT.md §2). -->
    <meta name="theme-color" content="#1a4d34" media="(max-width: 768px)" />
    <title>Frido Navigator</title>
    <script>
      // Applied before first paint so the saved theme is already on <html> when the
      // stylesheet resolves - otherwise the page paints the default palette first and
      // visibly flips once React mounts. Inline and synchronous on purpose.
      (function () {
        try {
          var t = localStorage.getItem("frido.theme");
          document.documentElement.setAttribute("data-theme", ["forest"].indexOf(t) >= 0 ? t : "forest");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "forest");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
